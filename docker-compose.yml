version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: laboratoriox_db
    environment:
      POSTGRES_DB: zone_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
