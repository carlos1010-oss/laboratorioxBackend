# Perfil de producción - Render
spring.profiles.active=prod

# Puerto asignado por Render
server.port=${PORT:8080}

# Base de datos - variables de entorno obligatorias
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# JPA / Hibernate - validación estricta, Flyway maneja esquema
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway - migraciones V1-V5
spring.flyway.enabled=true
spring.flyway.schemas=zone_control
spring.flyway.baseline-on-migrate=true
spring.flyway.create-schemas=true

# JWT - secret obligatorio en producción
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000

# Seguridad de sesión
seguridad.sesion.inactividad-minutos=60

# Integración socio internacional
integracion.socio.simular=true
integracion.socio.url=${INTEGRACION_SOCIO_URL:}
integracion.socio.max-reintentos=3
integracion.socio.reintento-minutos=15
integracion.socio.correo-habilitado=false

# SMTP para alertas (opcional)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator - solo health en producción
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=Laboratorio_lex.modules

# H2 Console DESHABILITADA en producción
spring.h2.console.enabled=false

# DevTools DESHABILITADO en producción
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false