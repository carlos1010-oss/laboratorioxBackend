spring.application.name=zone-control

# Conexión a PostgreSQL (Instancia local Docker mapeada a puerto 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/zone_control_db?currentSchema=zone_control}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logs de SQL detallados
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Estructura DDL inicializada manualmente mediante script; Flyway desactivado
spring.flyway.enabled=false
spring.sql.init.mode=never

# Configuración JWT
jwt.secret=9a2f8c7e1b4d6a8f3e5c7b9a1f4d6e8c2a5b7e9f1c4d6a8b0e3f5c7b9a1f4d6e
jwt.expiration=28800000

# Seguridad de sesión (F-03): minutos de inactividad antes de invalidar el token
seguridad.sesion.inactividad-minutos=5

# Integración con el socio internacional (F-27/F-28/F-29)
integracion.socio.simular=true
integracion.socio.url=
integracion.socio.max-reintentos=3
integracion.socio.reintento-minutos=15
integracion.socio.correo-habilitado=false

# Actuator: Exponer endpoints de salud
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=Laboratorio_lex.modules
