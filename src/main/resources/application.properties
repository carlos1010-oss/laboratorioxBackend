spring.application.name=zone-control

# Puerto para Render (usa $PORT) y local 8080
server.port=${PORT:8080}

# Conexión a PostgreSQL - local por defecto, en nube por variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zone_control}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zone_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ZoneControl2026*}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# Habilitar consola H2 en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JPA / Hibernate - Postgres real + Flyway V1-V4
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway activado: crea V1-V4 solo en Aiven vacía
spring.flyway.enabled=true
spring.flyway.schemas=zone_control
spring.flyway.baseline-on-migrate=true

spring.jpa.defer-datasource-initialization=true
# Configuración JWT - en Render pon JWT_SECRET
jwt.secret=${JWT_SECRET:9a2f8c7e1b4d6a8f3e5c7b9a1f4d6e8c2a5b7e9f1c4d6a8b0e3f5c7b9a1f4d6e}
jwt.expiration=28800000

# Seguridad de sesión (F-03): minutos de inactividad antes de invalidar el token
seguridad.sesion.inactividad-minutos=60

# Integración con el socio internacional (F-27/F-28/F-29)
# simular=true: no se hace POST real; el envío se registra como EXITOSO (contrato del socio pendiente)
integracion.socio.simular=true
integracion.socio.url=
integracion.socio.max-reintentos=3
integracion.socio.reintento-minutos=15
integracion.socio.correo-habilitado=false

# SMTP para alertas a supervisores (F-29). Sin spring.mail.host el envío queda en modo log
# spring.mail.host=
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# --- Configuraciones Agregadas (OpenAPI / Actuator) ---

# Actuator: Exponer endpoints de salud
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=Laboratorio_lex.modules