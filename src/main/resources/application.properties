spring.application.name=zone-control

# Conexión a PostgreSQL real
spring.datasource.url=jdbc:postgresql://localhost:5432/zone_control
spring.datasource.username=zone_user
spring.datasource.password=ZoneControl2026*
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update

# Habilitar consola H2 en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JPA / Hibernate
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway desactivado para usar H2 puro
spring.flyway.enabled=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# Configuración JWT
jwt.secret=9a2f8c7e1b4d6a8f3e5c7b9a1f4d6e8c2a5b7e9f1c4d6a8b0e3f5c7b9a1f4d6e
jwt.expiration=28800000

# Seguridad de sesión (F-03): minutos de inactividad antes de invalidar el token
seguridad.sesion.inactividad-minutos=5

# Integración con el socio internacional (F-27/F-28/F-29)
# simular=true: no se hace POST real; el envío se registra como EXITOSO (contrato del socio pendiente)
integracion.socio.simular=true
integracion.socio.url=
integracion.socio.max-reintentos=3
integracion.socio.reintento-minutos=15
integracion.socio.correo-habilitado=false

# SMTP para alertas a supervisores (F-29). Sin spring.mail.host el envío queda en modo log
# spring.mail.host=
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# --- Configuraciones Agregadas (OpenAPI / Actuator) ---

# Actuator: Exponer endpoints de salud
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=Laboratorio_lex.modules