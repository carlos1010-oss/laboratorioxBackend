spring.application.name=zone-control

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/zone_control_db?currentSchema=zone_control
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway activo para ejecutar V1__init_schema.sql automáticamente
spring.flyway.enabled=true
spring.flyway.schemas=zone_control
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

# Configuración JWT
jwt.secret=9a2f8c7e1b4d6a8f3e5c7b9a1f4d6e8c2a5b7e9f1c4d6a8b0e3f5c7b9a1f4d6e
jwt.expiration=28800000