spring.application.name=zone-control

# Base de datos H2 en memoria con creación automática del esquema zone_control
spring.datasource.url=jdbc:h2:mem:zonecontroldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS zone_control
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Generación de DDL por Hibernate (create-drop crea las tablas antes de cargar data.sql)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactivar Flyway mientras se trabaja en memoria
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=9a2f8c7e1b4d6a8f3e5c7b9a1f4d6e8c2a5b7e9f1c4d6a8b0e3f5c7b9a1f4d6e
jwt.expiration=28800000